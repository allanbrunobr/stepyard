name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # CI runners are ephemeral and the workflow expects the conventional target
  # path inside the checkout. Local cargo uses /tmp via .cargo/config.toml to
  # keep developer workspaces from growing huge target/ directories.
  CARGO_TARGET_DIR: target

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, clippy, audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `ubuntu-latest` ships ~14 GiB free; restoring our cargo cache plus
      # building the workspace `target/` from scratch overflows that. The
      # runner dies mid-job with "No space left on device" before even
      # flushing its own logs. `free-disk-space` reclaims ~25 GiB by
      # removing pre-installed Android SDK / .NET / Haskell / Boost /
      # Swift tooling we never use here.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # Cache dependency sources only. Caching `target/` made the cache archive
      # grow past 5 GiB and repeatedly left PR checks stuck in the restore
      # step before the build even started. The runner has enough disk after
      # the cleanup step to build from scratch; keeping `target/` out of the
      # cache makes CI slower but predictable.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Round 3 Story 5 — architecture §G-gates.
      #
      # `scripts/audit-patterns.sh` runs the ripgrep-based gates:
      #   G1 env-value leak          (blocking)
      #   G2 secret field via %       (blocking)
      #   G3 shell-string joining     (blocking)
      #   G5 Other(...) outside classifier (blocking)
      #   Rule7a real sleep in tests  (blocking)
      #
      # `cargo xtask audit-emit-before-io` runs the G4 syn AST walker as a
      # blocking gate. Low-level wrapper sites may use an explicit
      # `audit: emit-before-io exempt - reason: ...` comment when their caller
      # owns the persistence boundary.
      - name: Ensure ripgrep is installed
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Pattern audits (blocking)
        run: scripts/audit-patterns.sh

      - name: Emit-before-IO audit (G4 blocking)
        run: cargo xtask audit-emit-before-io

  sqlite-lite-smoke:
    name: SQLite Lite smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Check SQLite Lite CLI profile
        run: cargo check -p stepyard-engine --no-default-features --features sqlite

      - name: Run SQLite Lite CLI e2e smoke
        run: cargo test -p stepyard-engine --test cli_lite_smoke --no-default-features --features sqlite

      - name: Test SQLite session backend
        run: cargo test -p stepyard-session --no-default-features --features sqlite

      - name: Clippy SQLite session backend
        run: cargo clippy -p stepyard-session --all-targets --no-default-features --features sqlite -- -D warnings
