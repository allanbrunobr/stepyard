name: Release

# Trigger on version tags (e.g., v0.1.0)
on:
  push:
    tags:
      - "v*"

# Least privilege for GITHUB_TOKEN; only the release job below writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release packaging copies binaries from target/<triple>/release below.
  # Keep that path stable even though local cargo defaults to /tmp via
  # .cargo/config.toml.
  CARGO_TARGET_DIR: target
  BINARY_NAME: stepyard
  # Release binaries use the SQLite session store: no database server is
  # needed. The PostgreSQL build is installed with `cargo install`.
  BUILD_FEATURES: --no-default-features --features sqlite

# Third-party actions are pinned by commit SHA (the tag is in the comment).

jobs:
  # ──────────────────────────────────────────────────────────
  # Gates: a tag publishes nothing unless the full CI passes on its commit
  # and the tag matches the version in Cargo.toml.
  # ──────────────────────────────────────────────────────────
  check:
    name: CI checks
    uses: ./.github/workflows/check.yml

  tag-version:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare the tag with the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          echo "tag=${TAG} Cargo.toml version=${version}"
          if [ -z "$version" ] || [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Build pre-compiled binaries for all supported targets
  # ──────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [check, tag-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: stepyard-linux-x86_64

          # Linux aarch64 (native ARM runner; the previous `cross` build
          # failed on every tag). The cross steps below stay available for
          # matrix entries that set `cross: true`.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: stepyard-linux-aarch64

          # macOS x86_64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: stepyard-macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: stepyard-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Install cross for Linux aarch64 cross-compilation
      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build binary (native)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ env.BUILD_FEATURES }}

      - name: Build binary (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} ${{ env.BUILD_FEATURES }}

      # Rename binary to include platform suffix
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe `
             ${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ──────────────────────────────────────────────────────────
  # Create GitHub Release and attach all binaries
  # ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      # Build provenance attestation (actions/attest-build-provenance).
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Download all build artifacts into ./artifacts/. `merge-multiple`
      # puts every binary directly in artifacts/ instead of one subdirectory
      # per artifact, so checksums.sha256 lists plain file names.
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # Compute SHA256 checksums for all binaries
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum stepyard-* > ../checksums.sha256
          cat ../checksums.sha256

      # Signed SLSA provenance for each binary, verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/stepyard-*

      # Create GitHub Release with all binaries and checksums
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "Stepyard ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/stepyard-*
            checksums.sha256
          body: |
            Stepyard is alpha software. These binaries use the **SQLite** session
            store (sessions in `.stepyard/sessions.db`, steps run on the host by
            default). For the PostgreSQL build, use `cargo install` below.

            ## Installation

            ### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stepyard-macos-aarch64 -o stepyard
            chmod +x stepyard
            sudo mv stepyard /usr/local/bin/
            ```

            ### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stepyard-macos-x86_64 -o stepyard
            chmod +x stepyard
            sudo mv stepyard /usr/local/bin/
            ```

            ### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stepyard-linux-x86_64 -o stepyard
            chmod +x stepyard
            sudo mv stepyard /usr/local/bin/
            ```

            ### Linux (aarch64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stepyard-linux-aarch64 -o stepyard
            chmod +x stepyard
            sudo mv stepyard /usr/local/bin/
            ```

            Windows is not supported yet.

            ### Via cargo
            ```bash
            # SQLite build (same as the binaries)
            cargo install --locked --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }} --no-default-features --features sqlite
            # PostgreSQL build (default features)
            cargo install --locked --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }}
            ```

            ## Verify installation
            ```bash
            stepyard --version
            ```

            ## Verify a download
            Keep the release file name (for example `stepyard-linux-x86_64`)
            until it is verified, in the directory that holds `checksums.sha256`:
            ```bash
            sha256sum -c --ignore-missing checksums.sha256          # Linux
            shasum -a 256 -c --ignore-missing checksums.sha256      # macOS
            gh attestation verify stepyard-linux-x86_64 --repo ${{ github.repository }}
            ```
