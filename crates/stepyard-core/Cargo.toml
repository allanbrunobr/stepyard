[package]
name = "stepyard-core"
version = "0.1.0"
edition = "2021"
description = "Stable, IO-free types and traits shared across the Stepyard v2 crates"
license = "MIT"
authors = ["Allan Bruno"]

# Hard rule (Story 2.1 AC): no runtime IO deps. No tokio. No sqlx. No reqwest.
# Anything that pulls in a runtime belongs in a downstream crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Round 3 Story 1: the duration serde hooks are tested both against
# `serde_json` (fast, in-process) and `serde_yaml` (the actual workflow
# wire format) so the bare-integer rejection contract is proven on the
# real deserializer the harness will use in commit 2.
serde_yaml = "0.9"

[lints]
workspace = true
