[package]
name = "stepyard-session"
version = "0.1.0"
edition = "2021"
description = "Append-only session log primitive for the Stepyard v2 harness"
license = "MIT"
authors = ["Allan Bruno"]

[dependencies]
stepyard-core = { path = "../stepyard-core" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-native-tls",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
